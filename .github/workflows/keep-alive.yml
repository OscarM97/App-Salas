# Supabase (plan gratuito) pausa los proyectos que pasan ~7 días sin uso.
# Este workflow hace un "ping" cada 3 días para que eso no pase si la familia
# se va de vacaciones. Configura en GitHub → Settings → Secrets and variables
# → Actions:  SUPABASE_URL  y  SUPABASE_ANON_KEY  (los mismos que en Vercel).
name: Mantener Supabase activo
# (Ejecútalo a mano desde la pestaña Actions → "Run workflow" para probarlo.)

on:
  schedule:
    - cron: '17 15 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping a la base de datos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Faltan los secrets SUPABASE_URL / SUPABASE_ANON_KEY; no se hizo ping."
            exit 0
          fi
          # Tolerar valores pegados con espacios, comillas o con "NOMBRE=" adelante.
          url=$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]"'"'")
          url="https://${url#*https://}"; url="${url%/}"
          key=$(printf '%s' "$SUPABASE_ANON_KEY" | tr -d '[:space:]"'"'")
          key="${key##*=}"
          case "$key" in
            sb_publishable_*) tipo="Publishable key ✓" ;;
            sb_secret_*) tipo="SECRET key ✗ (usa la Publishable, no la secreta)" ;;
            eyJ*) tipo="anon key (formato antiguo)" ;;
            *) tipo="no reconocida ✗" ;;
          esac
          echo "Proyecto: ${url#https://} · Llave: $tipo, ${#key} caracteres"
          status=$(curl -sS -o resp.txt -w '%{http_code}' -X POST "$url/rest/v1/rpc/ping" \
            -H "apikey: $key" -H "Content-Type: application/json" -d '{}')
          echo "Respuesta HTTP $status:"; cat resp.txt; echo
          if [ "$status" != "200" ]; then
            echo "::error::Supabase rechazó el ping (HTTP $status). Revisa que SUPABASE_ANON_KEY sea la Publishable key (sb_publishable_…) o la anon key."
            exit 1
          fi
