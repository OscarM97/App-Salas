# Supabase (plan gratuito) pausa los proyectos que pasan ~7 días sin uso.
# Este workflow hace un "ping" cada 3 días para que eso no pase si la familia
# se va de vacaciones. Configura en GitHub → Settings → Secrets and variables
# → Actions:  SUPABASE_URL  y  SUPABASE_ANON_KEY  (los mismos que en Vercel).
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 15 */3 * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping a la base de datos
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::Faltan los secrets SUPABASE_URL / SUPABASE_ANON_KEY; no se hizo ping."
            exit 0
          fi
          curl -fsS -X POST "$SUPABASE_URL/rest/v1/rpc/ping" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
